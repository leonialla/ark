# ark configuration
# Default location: ~/.config/ark/config.yaml
# Run `ark reload` after editing to apply changes.

# All global options below are optional
# ssh_binary: /usr/bin/ssh      # ssh program to run (absolute path)
# connect_timeout: 10s          # timeout for establishing the SSH connection
# ssh_config_file: ~/.ssh/config # use a different ssh config (same as ssh -F)

tunnels:
  # local 127.0.0.1:4333 / [::1]:4333 → via ubuntu@203.0.113.180 → localhost:4333 on the server
  - name: prod-mysql
    local_port: 4333
    ssh: ubuntu@203.0.113.180
    remote: localhost:4333

  # ssh can also be a Host alias from ~/.ssh/config (ProxyJump and all other options work)
  - name: prod-redis
    local_port: 6379
    ssh: prod-redis
    remote: 10.0.1.5:6379
